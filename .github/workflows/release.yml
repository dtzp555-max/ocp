name: Auto Release on Tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned for the same reason test.yml pins it, and to the same version: the release body is
      # now built by scripts/release-notes.mjs, and the node that builds it in production should be
      # the node `npm test` proves it on. Leaving it to whatever the runner image ships would make
      # a runner-image bump able to break a release — a failure on the one path where nobody is
      # watching, which is the whole of #441.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      # Every value this step needs arrives through `env:`, and the `run:` body contains NO
      # `${{ }}` expression. That is not style — test-features.mjs slices the body out between
      # the anchors below and EXECUTES IT VERBATIM, which is only possible while it is plain
      # bash. A `${{ }}` put back into the body would make the tested text differ from the run
      # text, which is the whole failure #441 is made of: the only thing that had ever checked
      # this step was cutting a tag.
      - name: Build release notes
        id: notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          NOTES_FILE: /tmp/release-notes.md
        run: |
          # >>> #441 release-notes build — test-features.mjs slices between these anchors >>>
          set -euo pipefail
          node scripts/release-notes.mjs \
            --version "$VERSION" \
            --changelog CHANGELOG.md \
            --out "$NOTES_FILE" \
            --repo "$GITHUB_REPOSITORY"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          # <<< #441 release-notes build <<<
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — skipping"
            exit 0
          fi
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file "$NOTES_FILE" \
            --latest
