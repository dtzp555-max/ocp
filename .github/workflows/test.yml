name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-features:
    name: test-features.mjs (smoke)
    runs-on: ubuntu-latest

    # `test-features.mjs` is self-contained — it runs assertions against the
    # `keys.mjs` DB layer using a throwaway test database. It does NOT need a
    # live claude CLI or a running OCP server. So this job runs as a hard
    # check on every push / PR.
    #
    # If a future expansion of the suite adds tests that DO require a live
    # claude CLI or a running OCP server, mark those steps `continue-on-error:
    # true` (or split them into a separate job) — CI must not be flaky on
    # things outside the contributor's machine.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # The suite imports keys.mjs, which does `import { DatabaseSync } from
          # "node:sqlite"` at module load. Node removed that module's
          # `--experimental-sqlite` requirement in v22.13.0 and v23.4.0
          # (nodejs.org/api/sqlite.html § History), which is where package.json's
          # `engines: >=22.13.0` floor comes from.
          #
          # This pin is 24, ABOVE that floor, to match the reference fleet. Say so
          # plainly rather than implying the floor is tested: CI exercises 24 and
          # ONLY 24, so 22.13–23.x is a floor derived from Node's documentation and
          # not from a run. An earlier version of this comment called node:sqlite
          # "stable" on 24 — it is not; Node marks it Release Candidate only from
          # v25.7.0. Unflagged is the property that matters here, not stable.
          node-version: '24'

      # OCP has zero runtime npm dependencies (package-lock.json shows only
      # the project's own package and zero external entries). No install
      # step needed — `node:*` modules are built into Node 24.

      - name: Run test-features.mjs
        run: npm test
